<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raptor — the compiler, runtime and wire share one state graph</title>
    <meta
      name="description"
      content="Raptor is a zero-dependency stack for reactive and realtime apps. Fine-grained signals replace the virtual DOM, and a state-aware binary protocol sends delta operations instead of re-serialized JSON."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --panel: #fbfbfc;
        --panel-2: #f6f7f9;
        --soft: #fafbfc;
        --sunken: #f2f4f7;
        --border: #e4e6ea;
        --border-strong: #d7dae0;
        --text: #15181d;
        --muted: #4a515e;
        --dim: #5b6270;
        --faint: #8a909c;
        --accent: #17457a;
        --accent-hover: #0f2e52;
        --accent-soft: #eaf0f7;
        --accent-soft-border: #cfddec;
        --green: #0f6e4f;
        --code-bg: #fbfbfc;
        --radius: 10px;
        --maxw: 1160px;
        --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        --serif: "IBM Plex Serif", Georgia, serif;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { color: var(--accent-hover); }
      ::selection { background: #d6e4f2; color: var(--text); }
      h1, h2, h3 { margin: 0; }
      p { margin: 0; }
      code, pre { font-family: var(--mono); }
      .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }
      .view { animation: fade 0.25s ease; }
      @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
      .serif { font-family: var(--serif); font-weight: 600; letter-spacing: -0.02em; }

      /* Nav */
      header.nav { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
      .nav-inner { display: flex; align-items: center; gap: 26px; height: 60px; }
      .brand { display: flex; align-items: center; gap: 9px; cursor: pointer; flex-shrink: 0; }
      .logo { width: 17px; height: 17px; background: var(--accent); clip-path: polygon(0 0, 100% 50%, 0 100%, 28% 50%); }
      .brand .name { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
      .brand .ver { font-family: var(--mono); font-size: 10px; color: var(--dim); background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px; padding: 2px 5px; }
      nav.links { display: flex; gap: 2px; align-items: center; }
      .nav-link { padding: 7px 12px; border-radius: 6px; color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; }
      .nav-link:hover { color: var(--text); background: var(--panel-2); }
      .nav-link.active { color: var(--accent); background: var(--accent-soft); }
      .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
      .npm { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 12px; color: #3c424d; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; white-space: nowrap; }
      .npm .d { color: var(--faint); }
      .npm .cp { color: var(--accent); cursor: pointer; font-weight: 500; }
      .ghost-btn { font-size: 13px; font-weight: 500; color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; padding: 8px 14px; }
      .ghost-btn:hover { color: var(--text); border-color: var(--faint); }

      /* Buttons */
      .btn { font-size: 15px; font-weight: 500; padding: 12px 22px; border-radius: 6px; cursor: pointer; display: inline-block; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s; }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent-hover); color: #fff; }
      .btn-ghost { border-color: var(--border-strong); color: var(--text); background: #fff; }
      .btn-ghost:hover { border-color: var(--faint); }

      /* Hero */
      .hero { padding: 82px 0 64px; border-bottom: 1px solid var(--border); }
      .hero-grid { display: grid; grid-template-columns: minmax(0,1.05fr) minmax(0,0.95fr); gap: 56px; align-items: center; }
      .pill { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-soft-border); border-radius: 100px; padding: 5px 12px; margin-bottom: 24px; }
      .hero h1 { font-family: var(--serif); font-weight: 600; font-size: 54px; line-height: 1.08; letter-spacing: -0.025em; margin-bottom: 20px; text-wrap: balance; }
      .hero h1 .grad { color: var(--accent); }
      .lead { font-size: 18px; line-height: 1.6; color: var(--muted); max-width: 48ch; }
      .cta { display: flex; gap: 11px; align-items: center; flex-wrap: wrap; margin-top: 32px; }
      .install { display: inline-flex; align-items: center; gap: 11px; font-family: var(--mono); font-size: 13px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 9px 13px; margin-top: 22px; }
      .install .pfx { color: var(--faint); }
      .install .cp { margin-left: 4px; color: var(--accent); cursor: pointer; border: 0; background: transparent; font-family: var(--mono); font-size: 12px; font-weight: 500; }

      /* Code window */
      .codewin { border: 1px solid var(--border); border-radius: var(--radius); background: var(--code-bg); overflow: hidden; box-shadow: 0 1px 2px rgba(21,24,29,0.04), 0 12px 32px rgba(21,24,29,0.06); }
      .codewin .wbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel-2); border-bottom: 1px solid var(--border); }
      .codewin .wbar .wt { font-family: var(--mono); font-size: 11.5px; color: var(--text); font-weight: 500; }
      .codewin .wbar .wsub { font-family: var(--mono); font-size: 11px; color: var(--faint); }
      .codewin .code { font-size: 13.5px; }

      /* Sections */
      section.block { padding: 72px 0; border-bottom: 1px solid var(--border); }
      section.soft { background: var(--soft); }
      .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
      .h2 { font-family: var(--serif); font-weight: 600; font-size: 33px; letter-spacing: -0.02em; line-height: 1.15; margin: 12px 0 8px; text-wrap: balance; }
      .sub { color: var(--muted); font-size: 16px; line-height: 1.62; max-width: 60ch; }

      /* Grid + cards */
      .grid { display: grid; gap: 20px; margin-top: 30px; }
      .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
      .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
      .grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; transition: border-color 0.15s; }
      .card:hover { border-color: var(--accent-soft-border); }
      .card .num-lbl { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-bottom: 16px; }
      .card .ic { font-size: 20px; margin-bottom: 14px; }
      .card h3 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 8px; }
      .card .tag { font-family: var(--mono); font-size: 12px; color: var(--accent); }
      .card p { color: var(--muted); font-size: 15px; line-height: 1.62; margin-top: 8px; }

      /* "Is this for you?" — fit / not-yet lists */
      .fit { list-style: none; padding: 0; display: grid; gap: 12px; margin-top: 16px; }
      .fit li { display: grid; grid-template-columns: 16px 1fr; gap: 11px; font-size: 15px; line-height: 1.58; color: var(--muted); }
      .fit .m { font-family: var(--mono); font-size: 13px; line-height: 1.75; }
      .fit.yes .m { color: var(--accent); }
      .fit.no .m { color: var(--faint); }

      /* Diagram (one graph → four layers) */
      .layers { display: flex; align-items: stretch; }
      .layers .layer { flex: 1; text-align: center; }
      .layers .box { border: 1px solid var(--border-strong); border-radius: 7px; padding: 15px 8px; background: var(--panel-2); }
      .layers .box .t { font-size: 14px; font-weight: 600; }
      .layers .box .s { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 4px; }
      .layers .conn { width: 26px; align-self: center; height: 2px; background: repeating-linear-gradient(90deg, var(--accent) 0 5px, transparent 5px 10px); }

      /* Numbers */
      .barrow .top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; margin-bottom: 6px; color: #3c424d; }
      .bartrack { height: 9px; background: #eef0f3; border-radius: 3px; overflow: hidden; }
      .barfill { height: 100%; border-radius: 3px; }

      /* Code blocks */
      .codeblock { margin: 16px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
      .cb-head { display: flex; align-items: center; gap: 7px; padding: 8px 14px; background: var(--panel-2); border-bottom: 1px solid var(--border); }
      .cb-head .dot { width: 10px; height: 10px; border-radius: 50%; }
      .cb-file { margin-left: 8px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
      .cb-copy { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--accent); background: transparent; border: 0; cursor: pointer; font-weight: 500; }
      .code { margin: 0; padding: 18px; overflow-x: auto; font-size: 13px; line-height: 1.8; color: #2b303a; white-space: pre; tab-size: 2; }
      .code .k { color: #8250a8; }
      .code .s { color: #0f6e4f; }
      .code .c { color: #8a909c; font-style: italic; }
      .code .n { color: #0f6e4f; }
      .code .t { color: #b45309; }
      .code .f { color: #17457a; font-weight: 500; }

      /* Stat band */
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 30px; }
      .stats .s { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
      .stats .num { font-family: var(--serif); font-size: 40px; font-weight: 600; letter-spacing: -0.03em; color: var(--accent); line-height: 1; }
      .stats .cap { color: var(--muted); font-size: 14px; margin-top: 8px; }

      /* Demos */
      .demo { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
      .counter-val { font-family: var(--serif); font-size: 54px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .chip { font-family: var(--mono); font-size: 12.5px; padding: 5px 10px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
      .chip b { color: var(--text); }
      .sbtn { height: 40px; min-width: 40px; border-radius: 6px; border: 1px solid var(--border-strong); background: #fff; color: var(--text); font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.12s; }
      .sbtn:hover { border-color: var(--accent); color: var(--accent); }
      .bar { height: 9px; border-radius: 3px; background: #eef0f3; overflow: hidden; }
      .bar > span { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }
      table.jobs { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 14px; }
      table.jobs td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
      table.jobs td:first-child { color: var(--faint); font-family: var(--mono); width: 42px; }
      .metric-big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
      .stat { display: flex; flex-direction: column; gap: 2px; }
      .stat .lbl { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; }
      .win { color: var(--green); font-weight: 700; }
      .badge-live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--green); font-family: var(--mono); }
      .badge-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.6s infinite; }
      @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(15,110,79,0.4); } 70% { box-shadow: 0 0 0 7px rgba(15,110,79,0); } 100% { box-shadow: 0 0 0 0 rgba(15,110,79,0); } }

      /* Docs layout */
      .doc-shell { display: grid; grid-template-columns: 250px minmax(0,1fr); gap: 44px; align-items: start; padding: 46px 0 76px; }
      .doc-shell.with-toc { grid-template-columns: 240px minmax(0,1fr) 200px; }
      .sidebar { position: sticky; top: 78px; max-height: calc(100vh - 98px); overflow-y: auto; }
      .side-group { margin-bottom: 22px; }
      .side-group > .side-title { font-family: var(--mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); margin-bottom: 9px; padding: 0 10px; }
      .side-item { display: block; padding: 6px 10px; border-radius: 5px; color: #3c424d; font-size: 14px; cursor: pointer; }
      .side-item:hover { background: var(--panel-2); color: var(--text); }
      .side-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 500; }

      /* Schimbarea componentei: doar panoul de detaliu se inlocuieste, iar
         intrarea lui e scurta si discreta. 160ms e sub pragul la care miscarea
         devine ceva ce astepti; peste ~250ms navigarea incepe sa para lenta. */
      @keyframes pane-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .pane-enter { animation: pane-in 160ms cubic-bezier(.22,.7,.3,1); }
      .side-item { transition: background-color 120ms ease, color 120ms ease; }
      .sidebar { scroll-behavior: smooth; overscroll-behavior: contain; }
      @media (prefers-reduced-motion: reduce) {
        .pane-enter { animation: none; }
        .side-item { transition: none; }
        .sidebar { scroll-behavior: auto; }
      }
      .prose { min-width: 0; max-width: 820px; }
      .prose .crumbs { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-bottom: 12px; }
      .prose h1 { font-family: var(--serif); font-weight: 600; font-size: 38px; letter-spacing: -0.025em; margin-bottom: 12px; }
      .prose .intro { color: var(--muted); font-size: 17px; line-height: 1.65; margin-bottom: 10px; }
      .prose h2 { font-size: 23px; font-weight: 600; letter-spacing: -0.015em; margin: 34px 0 8px; scroll-margin-top: 78px; }
      .prose h3 { font-size: 18px; font-weight: 600; margin: 24px 0 6px; scroll-margin-top: 78px; }
      .prose p { margin: 14px 0; color: var(--muted); font-size: 16px; line-height: 1.65; }
      .prose ul { margin: 14px 0; padding-left: 22px; color: var(--muted); }
      .prose li { margin: 7px 0; }
      .prose a.inl { color: var(--accent); border-bottom: 1px solid var(--accent-soft-border); cursor: pointer; }
      .prose code.inl { background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; font-size: 0.88em; color: var(--accent); }
      .prose .anchor { color: var(--faint); opacity: 0; margin-left: 8px; font-weight: 400; }
      .prose h2:hover .anchor, .prose h3:hover .anchor { opacity: 1; }

      .callout { border: 1px solid var(--accent-soft-border); border-radius: 8px; padding: 13px 18px; margin: 18px 0; background: #f4f8fc; font-size: 14.5px; color: #2b303a; }
      .callout .ct { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; display: flex; gap: 7px; align-items: center; color: var(--accent); }
      .callout.tip { border-color: #bfe3cf; background: #f1f9f4; } .callout.tip .ct { color: var(--green); }
      .callout.warn { border-color: #f0d8a8; background: #fdf6e9; } .callout.warn .ct { color: #b45309; }

      .toc { position: sticky; top: 78px; }
      .toc .tt { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-bottom: 13px; }
      .toc a { display: block; color: var(--dim); padding: 5px 0 5px 10px; border-left: 2px solid var(--border); font-size: 13.5px; cursor: pointer; }
      .toc a:hover { color: var(--accent); border-left-color: var(--accent); }

      .prevnext { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 44px; border-top: 1px solid var(--border); padding-top: 24px; }
      .pn { border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; cursor: pointer; }
      .pn:hover { border-color: var(--accent); }
      .pn .d { font-family: var(--mono); color: var(--faint); font-size: 11px; }
      .pn .t { color: var(--text); font-weight: 500; margin-top: 4px; }
      .pn.next { text-align: right; }

      /* Reference API */
      .api { border-top: 1px solid var(--border); padding: 26px 0; }
      .api:first-of-type { border-top: 0; }
      .api .sig { font-family: var(--mono); font-size: 13.5px; color: var(--accent); background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
      .api .params { margin: 14px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .api .param { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 14px; }
      .api .param:first-child { border-top: 0; }
      .api .param .pn2 { font-family: var(--mono); color: var(--accent); }
      .api-live { font-size: 15px; font-weight: 600; margin: 20px 0 0; display: flex; align-items: baseline; gap: 10px; }
      .api-import { font-size: 13px; margin: 12px 0 4px; }
      .api-notes { margin: 16px 0 0; }
      .api-notes .ct { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
      .api-notes ul { margin: 0; padding-left: 18px; }
      .api-notes li { font-size: 14.5px; line-height: 1.6; color: var(--muted); padding: 3px 0; }

      /* "Which package do I need?" routes */
      .routes { margin: 24px 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
      .route { display: grid; grid-template-columns: 220px 1fr; gap: 20px; padding: 16px 18px; border-top: 1px solid var(--border); cursor: pointer; transition: background 0.12s; }
      .route:first-child { border-top: 0; }
      .route:hover { background: var(--panel-2); }
      .route-want { font-size: 15px; font-weight: 600; line-height: 1.4; }
      .route-pkgs { display: flex; flex-wrap: wrap; gap: 6px; }
      .route-note { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 7px 0 0; }
      .kbd { font-family: var(--mono); font-size: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; color: var(--muted); }

      /* Playground */
      .pg { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
      .pg-editor { display: flex; flex-direction: column; gap: 8px; }
      .pg-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
      .pg-tab { padding: 6px 12px; border-radius: 100px; font-size: 13px; cursor: pointer; border: 1px solid var(--border-strong); background: #fff; color: #3c424d; }
      .pg-tab.active { color: #fff; border-color: var(--accent); background: var(--accent); }
      textarea.pg-code { width: 100%; height: 400px; background: var(--code-bg); color: #2b303a; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-family: var(--mono); font-size: 13px; line-height: 1.7; resize: vertical; tab-size: 2; }
      textarea.pg-code:focus { outline: none; border-color: var(--accent); }
      .pg-preview { border: 1px solid var(--border); border-radius: 8px; background: #fff; min-height: 400px; padding: 18px; }
      .pg-preview .phead { font-family: var(--mono); font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; display: flex; justify-content: space-between; }
      .pg-err { color: #b42318; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
      .live-demo { margin: 18px 0; }

      /* Data tables (benchmarks) */
      .tablewrap { margin: 20px 0; overflow-x: auto; }
      table.data { border-collapse: collapse; width: 100%; font-size: 14px; }
      table.data th, table.data td { padding: 9px 14px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
      table.data thead th { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); font-weight: 500; border-bottom: 1px solid var(--border-strong); }
      table.data td.n, table.data th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
      table.data td.best { color: var(--accent); font-weight: 600; }
      table.data tbody tr:last-child td { border-bottom: 0; }
      .tcap { color: var(--dim); font-size: 13px; line-height: 1.55; margin-top: 10px; }

      /* Components catalog */
      .cmp-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
      .tier { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; border-radius: 100px; padding: 3px 10px; border: 1px solid var(--accent-soft-border); background: var(--accent-soft); color: var(--accent); }
      .tier.t2 { border-color: #bfe3cf; background: #f1f9f4; color: var(--green); }
      .tier.t3 { border-color: #f0d8a8; background: #fdf6e9; color: #b45309; }
      .cmp-live { font-family: var(--mono); font-size: 10.5px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin-left: 10px; }
      .cmp-stage { border: 1px solid var(--border); border-radius: var(--radius); background: #fff; padding: 24px; margin: 14px 0 6px; background-image: radial-gradient(var(--sunken) 1px, transparent 1px); background-size: 18px 18px; }
      .cmp-stage > * { background: transparent; }
      .cmp-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
      .cmp-row:last-child { margin-bottom: 0; }
      .cmp-panel { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
      .cmp-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
      .params { margin: 14px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .param { display: grid; grid-template-columns: 180px 1fr; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 14px; }
      .param:first-child { border-top: 0; }
      .param .pn2 { font-family: var(--mono); color: var(--accent); }
      .cmp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0; }
      .cmp-stats .s { background: var(--soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
      .cmp-stats .num { font-family: var(--serif); font-size: 32px; font-weight: 600; color: var(--accent); line-height: 1; }
      .cmp-stats .cap { color: var(--muted); font-size: 13.5px; margin-top: 7px; line-height: 1.5; }
      .cmp-group { border-top: 1px solid var(--border); padding-top: 24px; margin-top: 30px; }
      .cmp-group-head { display: flex; align-items: baseline; gap: 10px; }
      .cmp-count { font-family: var(--mono); font-size: 11px; color: var(--faint); border: 1px solid var(--border); border-radius: 100px; padding: 2px 9px; }
      .cmp-chips { display: flex; flex-wrap: wrap; gap: 7px; }
      .cmp-chip { font-size: 13.5px; color: #3c424d; background: #fff; border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
      .cmp-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

      /* Footer */
      .foot { border-top: 1px solid var(--border); background: var(--soft); padding: 50px 0 30px; }
      .foot-grid { display: grid; grid-template-columns: minmax(0,1.4fr) repeat(4, minmax(0,1fr)); gap: 32px; }
      .foot p { font-size: 13.5px; line-height: 1.6; color: var(--dim); max-width: 34ch; margin-top: 11px; }
      .foot .ct { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-bottom: 13px; }
      .foot .col a, .foot .col span { display: block; font-size: 14px; color: #3c424d; cursor: pointer; padding: 4px 0; }
      .foot .col a:hover, .foot .col span:hover { color: var(--accent); }
      .foot-base { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; font-family: var(--mono); font-size: 11.5px; color: #a8aeb8; }

      @media (max-width: 940px) {
        .hero-grid { grid-template-columns: 1fr; }
        .doc-shell, .doc-shell.with-toc { grid-template-columns: 1fr; }
        .sidebar { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 18px; }
        .toc { display: none; }
        .pg { grid-template-columns: 1fr; }
        .stats { grid-template-columns: repeat(2, 1fr); }
        .foot-grid { grid-template-columns: 1fr 1fr; }
        .layers { flex-direction: column; gap: 8px; }
        .layers .conn { width: 2px; height: 18px; margin: 0 auto; background: repeating-linear-gradient(180deg, var(--accent) 0 5px, transparent 5px 10px); }
      }
      @media (max-width: 700px) {
        .wrap { padding: 0 18px; }
        /* minmax(0, …), not 1fr: a plain 1fr track cannot shrink below the card's
           min-content (305px here), so the grid overflowed on narrow phones.
           The card scrolls its own wide rows instead. */
        .grid.cols-2, .grid.cols-3 { grid-template-columns: minmax(0, 1fr); }
        .demo { padding: 16px; overflow-x: auto; }
        .hero h1 { font-size: 40px; }
        .prevnext { grid-template-columns: 1fr; }
        .cmp-stats { grid-template-columns: 1fr; }
        .param { grid-template-columns: 1fr; gap: 4px; }
        .route { grid-template-columns: 1fr; gap: 8px; }
      }

      /* Nav has its own breakpoints: the full row (brand + 5 links + npm box +
         GitHub) needs ~1015px, and ~755px once the npm box is dropped. Tying it
         to the 700px page breakpoint left it overflowing on tablets. */
      @media (max-width: 1020px) {
        .npm { display: none; }
      }
      @media (max-width: 800px) {
        /* Brand + GitHub keep row 1; the links get their own full-width row and
           wrap. At 375px the five links need ~409px, so a single row could never
           fit and pushed the whole page sideways. Two rows are too tall to pin,
           so the header stops being sticky here. */
        header.nav { position: static; }
        .brand .ver { display: none; }
        .nav-inner { flex-wrap: wrap; height: auto; gap: 8px 12px; padding-top: 9px; padding-bottom: 9px; }
        nav.links { order: 3; width: 100%; flex-wrap: wrap; gap: 2px 4px; }
        .nav-link { padding: 6px 9px; font-size: 13.5px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
