<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo realtime - RaptorWire</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
      h1 { font-size: 1.5rem; margin: 0; }
      .status { font: 0.8rem/1 ui-monospace, monospace; padding: 0.35rem 0.6rem; border-radius: 100px; }
      .status.online { background: #dcfce7; color: #166534; }
      .status.offline { background: #fee2e2; color: #991b1b; }
      .status.connecting { background: #fef3c7; color: #854d0e; }
      form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
      input[type="text"], input:not([type]) { flex: 1; padding: 0.55rem 0.7rem; font: inherit; border: 1px solid #cbd5e1; border-radius: 0.4rem; }
      button { padding: 0.55rem 0.9rem; font: inherit; border: 1px solid #cbd5e1; border-radius: 0.4rem; background: #f8fafc; cursor: pointer; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-bottom: 1px solid #e2e8f0; }
      li label { display: flex; align-items: center; gap: 0.6rem; flex: 1; cursor: pointer; }
      .done { text-decoration: line-through; opacity: 0.55; }
      .rm { border: 0; background: none; color: #94a3b8; font-size: 1.1rem; line-height: 1; padding: 0 0.3rem; }
      .rm:hover { color: #dc2626; }
      .empty { color: #64748b; font-size: 0.95rem; }
      footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; }
      .hint { color: #64748b; font-size: 0.85rem; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
