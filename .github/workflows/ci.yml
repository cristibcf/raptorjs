# Garda care ar fi prins cele mai multe dintre problemele auditului din
# 2026-09-24: `pnpm typecheck` era rupt de zile intregi si README-ul il prezenta
# ca trecand, iar cifrele despre proiect divergasera in trei locuri.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Type stripping nativ cere >= 22.6; 24 e ce folosim local.
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Doua programe TypeScript: `raptor:` are un profil asincron (bootstrap)
      # si unul sincron (binarul nativ), si nu pot sta in acelasi program.
      - name: Typecheck
        run: pnpm typecheck

      - name: Teste
        run: pnpm test

      # Cifrele din README si de pe pagina de start se masoara, nu se scriu de
      # mana. Daca au ramas in urma, asta pica si spune ce sa rulezi.
      - name: Cifrele sunt la zi
        run: pnpm stats:check

  rust:
    name: Binarul nativ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/runtime-native

      # Build-ul implicit trebuie sa ramana zero-dependente: daca cineva adauga
      # un crate fara sa-l puna in spatele unui feature, asta se vede aici.
      - name: Teste (implicit, zero-dep)
        working-directory: packages/runtime-native
        run: cargo test

      - name: Teste (toate feature-urile)
        working-directory: packages/runtime-native
        run: cargo test --features full

      - name: Clippy
        working-directory: packages/runtime-native
        run: cargo clippy --all-targets -- -D warnings
